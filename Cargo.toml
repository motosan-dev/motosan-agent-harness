[workspace]
members = [".", "finance"]
resolver = "2"

[workspace.dependencies]
motosan-agent-primitives = { version = "0.2.0", path = "../motosan-agent-primitives" }
motosan-agent-tool = { version = "0.5.0", path = "../motosan-agent-tool" }
async-trait = "0.1"

[package]
name = "motosan-agent-harness"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/motosan-dev/motosan-agent-harness"
homepage = "https://github.com/motosan-dev/motosan-agent-harness"
documentation = "https://docs.rs/motosan-agent-harness"
readme = "README.md"
description = "Composition contract for vertical Motosan agent bundles — the Harness trait"
authors = ["motosan-dev"]
keywords = ["ai", "agent", "harness", "llm"]
categories = ["development-tools"]

[dependencies]
motosan-agent-primitives.workspace = true
motosan-agent-tool.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json = "1"
